# Preview-only configuration. Production intentionally fails closed.
# Existing production dashboard settings are not changed by this file on a PR branch.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

[context.deploy-preview]
  command = "npm run build"
  publish = "dist"

[context.production]
  command = "node scripts/block-production.mjs"

# No notifications, CRM, GA4 destinations, or production form routing configured here.
