# Source-controlled build settings for approved previews and production from main.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

[context.deploy-preview]
  command = "npm run build"
  publish = "dist"

[context.production]
  command = "npm run build"
  publish = "dist"

# Guard logic in scripts/guard.mjs rejects unexpected Netlify contexts.
# Notification routing remains managed in the existing Netlify form configuration.
