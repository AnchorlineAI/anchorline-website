<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">An inspectable advertising journey</title>
  <desc id="desc">A continuous line connects search intent, a creative asset, a landing page, and a qualified outcome.</desc>
  <rect width="1600" height="900" fill="#f7f9fb"/>
  <path d="M108 139H1492M108 762H1492" stroke="#c8d6e4" stroke-width="2"/>
  <text x="110" y="113" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172c42">THE INSPECTABLE JOURNEY</text>
  <text x="111" y="802" font-family="Arial, sans-serif" font-size="21" fill="#627183">A connected view, not a claim of attribution</text>
  <path d="M244 473H1370" stroke="#2455a6" stroke-width="12" stroke-linecap="round"/>
  <path d="m1355 453 28 20-28 20" fill="none" stroke="#2455a6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff" stroke="#c8d6e4" stroke-width="3">
    <rect x="105" y="255" width="310" height="410" rx="6"/>
    <rect x="465" y="255" width="310" height="410" rx="6"/>
    <rect x="825" y="255" width="310" height="410" rx="6"/>
    <rect x="1185" y="255" width="310" height="410" rx="6"/>
  </g>
  <g fill="#2455a6" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="133" y="300">01 / INTENT</text>
    <text x="493" y="300">02 / MESSAGE</text>
    <text x="853" y="300">03 / DESTINATION</text>
    <text x="1213" y="300">04 / OUTCOME</text>
  </g>
  <g stroke="#172c42" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="248" cy="409" r="48"/>
    <path d="m282 443 35 35"/>
    <rect x="558" y="361" width="125" height="95" rx="3"/>
    <path d="M577 390h85M577 411h58M577 432h70" stroke-width="5"/>
    <path d="M908 369h143v112H908zM908 400h143"/>
    <path d="M934 429h87M934 448h60" stroke-width="5"/>
    <circle cx="1340" cy="417" r="55"/>
    <path d="m1314 416 18 19 36-40"/>
  </g>
  <g fill="#172c42" font-family="Arial, sans-serif" font-size="25" font-weight="600">
    <text x="133" y="563">Search term</text>
    <text x="493" y="563">Creative asset</text>
    <text x="853" y="563">Landing page</text>
    <text x="1213" y="563">Qualified action</text>
  </g>
  <g fill="#627183" font-family="Arial, sans-serif" font-size="19">
    <text x="133" y="599">What was sought?</text>
    <text x="493" y="599">What was shown?</text>
    <text x="853" y="599">Where did they land?</text>
    <text x="1213" y="599">What happened next?</text>
  </g>
  <circle cx="248" cy="473" r="14" fill="#2455a6" stroke="#fff" stroke-width="5"/>
  <circle cx="608" cy="473" r="14" fill="#2455a6" stroke="#fff" stroke-width="5"/>
  <circle cx="968" cy="473" r="14" fill="#2455a6" stroke="#fff" stroke-width="5"/>
  <circle cx="1340" cy="473" r="14" fill="#168a78" stroke="#fff" stroke-width="5"/>
