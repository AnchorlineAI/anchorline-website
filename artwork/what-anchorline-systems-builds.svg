<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Anchorline Growth Engine</title>
  <desc id="desc">A connected seven-stage system moves from attract through improve, with strategy, intelligence, technology, and execution supporting the work and evidence returning to the next cycle.</desc>
  <rect width="1600" height="900" fill="#f7f9fb"/>
  <path d="M108 139H1492M108 762H1492" stroke="#c8d6e4" stroke-width="2"/>
  <text x="110" y="113" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172c42">THE ANCHORLINE GROWTH ENGINE</text>
  <text x="111" y="803" font-family="Arial, sans-serif" font-size="21" fill="#627183">Connected work, accountable handoffs, and learning that returns to the next cycle</text>
  <g fill="#eef3f7" stroke="#c8d6e4" stroke-width="2">
    <rect x="110" y="188" width="300" height="58" rx="4"/>
    <rect x="440" y="188" width="300" height="58" rx="4"/>
    <rect x="770" y="188" width="300" height="58" rx="4"/>
    <rect x="1100" y="188" width="390" height="58" rx="4"/>
  </g>
  <g fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="260" y="224">STRATEGY</text>
    <text x="590" y="224">INTELLIGENCE</text>
    <text x="920" y="224">TECHNOLOGY</text>
    <text x="1295" y="224">EXECUTION</text>
  </g>
  <path d="M165 478H1432" stroke="#2455a6" stroke-width="8" stroke-linecap="round"/>
  <path d="m1415 461 27 17-27 17" fill="none" stroke="#2455a6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#172c42" stroke-width="3">
    <rect x="110" y="315" width="180" height="220" rx="5"/>
    <rect x="315" y="315" width="180" height="220" rx="5"/>
    <rect x="520" y="315" width="180" height="220" rx="5"/>
    <rect x="725" y="315" width="180" height="220" rx="5"/>
    <rect x="930" y="315" width="180" height="220" rx="5"/>
    <rect x="1135" y="315" width="180" height="220" rx="5"/>
    <rect x="1340" y="315" width="150" height="220" rx="5"/>
  </g>
  <g fill="#2455a6" font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <text x="132" y="350">01</text>
    <text x="337" y="350">02</text>
    <text x="542" y="350">03</text>
    <text x="747" y="350">04</text>
    <text x="952" y="350">05</text>
    <text x="1157" y="350">06</text>
    <text x="1362" y="350">07</text>
  </g>
  <g fill="#172c42" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="200" y="407">Attract</text>
    <text x="405" y="407">Identify</text>
    <text x="610" y="407">Engage</text>
    <text x="815" y="407">Convert</text>
    <text x="1020" y="407">Follow up</text>
    <text x="1225" y="407">Learn</text>
    <text x="1415" y="407">Improve</text>
  </g>
  <g fill="#627183" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="200" y="443">right people</text><text x="200" y="465">can find you</text>
    <text x="405" y="443">focus on</text><text x="405" y="465">the right fit</text>
    <text x="610" y="443">earn a relevant</text><text x="610" y="465">response</text>
    <text x="815" y="443">make the next</text><text x="815" y="465">step clear</text>
    <text x="1020" y="443">preserve context</text><text x="1020" y="465">and ownership</text>
    <text x="1225" y="443">read the</text><text x="1225" y="465">evidence</text>
    <text x="1415" y="443">strengthen</text><text x="1415" y="465">the next cycle</text>
  </g>
